<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep purple canvas -->
    <linearGradient id="base" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2a1758"/>
      <stop offset="0.45" stop-color="#3b1f7a"/>
      <stop offset="1" stop-color="#1e1046"/>
    </linearGradient>
    <!-- Ambient glows -->
    <radialGradient id="glowTL" cx="20%" cy="18%" r="55%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="82%" cy="88%" r="55%">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="45%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <!-- Glass frame fill (subtle translucent sheen) -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d5ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#c4b5fd" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#glowTL)"/>
  <rect width="1600" height="1000" fill="url(#glowBR)"/>
  <rect width="1600" height="1000" fill="url(#glowCenter)"/>

  <!-- Flowing light waves -->
  <g fill="none" stroke="#d8b4fe" stroke-opacity="0.22" stroke-width="2">
    <path d="M-50 360 C 320 250, 560 520, 900 400 S 1400 260, 1660 440"/>
    <path d="M-50 520 C 340 420, 600 700, 940 560 S 1420 420, 1660 620"/>
    <path d="M-50 680 C 300 600, 560 860, 900 720 S 1420 600, 1660 780"/>
  </g>
  <g fill="none" stroke="#f5d0fe" stroke-opacity="0.12" stroke-width="1.5">
    <path d="M-50 300 C 280 210, 520 400, 820 300 S 1340 180, 1660 340"/>
    <path d="M-50 740 C 300 660, 560 900, 900 760 S 1400 660, 1660 820"/>
  </g>

  <!-- Glowing translucent glass frame (centered) -->
  <g>
    <!-- outer halo -->
    <rect x="470" y="270" width="660" height="460" rx="42"
          fill="none" stroke="#c4b5fd" stroke-opacity="0.55" stroke-width="10" filter="url(#glowBlur)"/>
    <!-- glass panel -->
    <rect x="480" y="280" width="640" height="440" rx="38"
          fill="url(#glassFill)" filter="url(#soft)"/>
    <!-- crisp edge -->
    <rect x="480" y="280" width="640" height="440" rx="38"
          fill="none" stroke="url(#glassEdge)" stroke-width="2.5"/>
    <!-- top sheen highlight -->
    <path d="M508 320 Q 800 300 1092 320" fill="none"
          stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
    <!-- inner soft reflection -->
    <rect x="512" y="312" width="576" height="180" rx="26"
          fill="#ffffff" fill-opacity="0.05"/>
  </g>
</svg>
