# Reverse proxy for Neuro Recode WhatsApp.
# Replace `chat.neurorecode.com` with your Hostinger domain/subdomain.
# For TLS, run certbot to place fullchain.pem/privkey.pem under ./certs and
# switch the server block to listen on 443 (template shown below).

upstream nrw_api {
  server api:4000;
}
upstream nrw_web {
  server web:3000;
}

server {
  listen 80;
  server_name chat.neurorecode.com;

  client_max_body_size 25m;

  # WhatsApp webhook (Meta calls GET to verify, POST for events)
  location /webhooks/ {
    proxy_pass http://nrw_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # REST API
  location /api/ {
    proxy_pass http://nrw_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://nrw_api;
  }

  # Socket.IO (agent namespace) — needs WebSocket upgrade
  location /agent/ {
    proxy_pass http://nrw_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Web app (Next.js)
  location / {
    proxy_pass http://nrw_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

